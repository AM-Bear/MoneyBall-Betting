kind = "api"
previewPath = "/api"
title = "MONEYLINE API"
description = "FastAPI model, live MLB feed, odds math, screener, and persistent grading service for MONEYLINE."
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production.build]
args = ["pnpm", "--filter", "@workspace/moneyline", "run", "precompute"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = ["pnpm", "--filter", "@workspace/api-server", "run", "start"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"

[services.production.health.startup]
path = "/api/health"

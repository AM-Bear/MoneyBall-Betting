kind = "web"
previewPath = "/"
title = "MONEYLINE"
description = "A production Moneyball trading desk that prices baseball teams with verified chronological regression models, live MLB data, transparent odds math, and an append-only graded record."
version = "1.0.0"
id = "artifacts/moneyline"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18612

[services.development]
run = "pnpm --filter @workspace/moneyline run dev"

[services.production.build]
args = ["pnpm", "--filter", "@workspace/moneyline", "run", "build:production"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = ["pnpm", "--filter", "@workspace/moneyline", "run", "start"]

[services.production.run.env]
NODE_ENV = "production"

[services.production.health.startup]
path = "/"

[services.env]
PORT = "18612"
BASE_PATH = "/"
